[package]
name = "backend"
version = "2.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
biblatex = "0.12.0"
openidconnect = "4.0.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "fs"] }
